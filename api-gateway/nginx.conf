server {
    listen 80;
    server_name localhost;

    # Injects or generates X-Correlation-ID for distributed tracing
    set $correlation_id $http_x_correlation_id;
    if ($correlation_id = "") {
        set $correlation_id $request_id;
    }

    # Return correlation ID header to client response
    add_header X-Correlation-ID $correlation_id always;

    # Routing to React Frontend Container
    location / {
        proxy_pass http://saashr-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Routing to auth-service API
    location /api/v1/auth/ {
        proxy_pass http://saashr-auth:8000/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_id;
    }

    # Routing to tenant-service API
    location /api/v1/tenants/ {
        proxy_pass http://saashr-tenant:8001/api/v1/tenants/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_id;
    }

    # Routing to hr-service API
    location /api/v1/hr/ {
        proxy_pass http://saashr-hr:8002/api/v1/hr/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $correlation_id;
    }
}
