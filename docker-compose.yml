version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: saashr-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-strongpassword123}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Automating DB creation & seeding on startup
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - saashr-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-strongpassword123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    container_name: saashr-auth
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql-db
      - MYSQL_PORT=3306
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-strongpassword123}@mysql-db:3306/auth_db
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - saashr-network

  tenant-service:
    build:
      context: ./microservices/tenant-service
      dockerfile: Dockerfile
    container_name: saashr-tenant
    restart: always
    ports:
      - "8001:8001"
    environment:
      - MYSQL_HOST=mysql-db
      - MYSQL_PORT=3306
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-strongpassword123}@mysql-db:3306/tenant_db
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL:-}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - saashr-network

  hr-service:
    build:
      context: ./microservices/hr-service
      dockerfile: Dockerfile
    container_name: saashr-hr
    restart: always
    ports:
      - "8002:8002"
    environment:
      - MYSQL_HOST=mysql-db
      - MYSQL_PORT=3306
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-strongpassword123}@mysql-db:3306/hr_db
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL:-}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - saashr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saashr-frontend
    restart: always
    expose:
      - "80"
    networks:
      - saashr-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: saashr-gateway
    restart: always
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - tenant-service
      - hr-service
      - frontend
    networks:
      - saashr-network

volumes:
  mysql-data:

networks:
  saashr-network:
    name: saashr-network
    driver: bridge
